name: Local image validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-core.txt bandit pip-audit
      - run: python -m unittest discover -s tests -v
      - run: python -m bandit background_remover.py image_processor.py -ll
      - run: python -m pip_audit -r requirements-core.txt
